# Produzione Centropic — /etc/nginx/sites-available/aio-bot
# Apex canonico: centropic.ai
# Legacy: geopulse.it / www.geopulse.it → 301 https://centropic.ai$request_uri
# www.centropic.ai → 301 https://centropic.ai$request_uri
#
# Certificato LE: tipicamente multi-SAN su /etc/letsencrypt/live/geopulse.it/
# (storico). Aggiornare path se si emette un cert dedicato a centropic.ai.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name centropic.ai www.centropic.ai geopulse.it www.geopulse.it;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    # Legacy brand → canonical apex even before TLS upgrade.
    location / {
        return 301 https://centropic.ai$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.centropic.ai;
    ssl_certificate     /etc/letsencrypt/live/geopulse.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geopulse.it/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://centropic.ai$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name geopulse.it www.geopulse.it;
    ssl_certificate     /etc/letsencrypt/live/geopulse.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geopulse.it/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://centropic.ai$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name centropic.ai;

    ssl_certificate     /etc/letsencrypt/live/geopulse.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geopulse.it/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Served directly by nginx (bypasses gunicorn). Safe to cache
    # long-term + immutable because Flask appends ?v=<mtime> to every
    # url_for('static', ...) call, so a changed file gets a new URL.
    location /static/ {
        alias /opt/aio-bot/static/;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
