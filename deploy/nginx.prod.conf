# Produzione Centropic / GeoPulse — /etc/nginx/sites-available/aio-bot
# Domini: centropic.ai / www.centropic.ai / geopulse.it / www.geopulse.it
# TLS: Let's Encrypt via certbot.
#
# Setup / rinnovo:
#   sudo certbot --nginx \
#     -d centropic.ai -d www.centropic.ai \
#     -d geopulse.it -d www.geopulse.it \
#     --redirect --non-interactive --agree-tos -m info@centropic.ai
#
# Dopo certbot i path certificato possono cambiare: preferire un unico cert
# che include tutti i SAN, oppure due server {} SSL distinti.

# HTTP → HTTPS (tutti i host pubblici; NON usare return 404)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name centropic.ai www.centropic.ai geopulse.it www.geopulse.it 82.165.79.212 _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name centropic.ai www.centropic.ai geopulse.it www.geopulse.it 82.165.79.212 _;

    # Aggiornato da certbot — path di esempio (geopulse o centropic)
    ssl_certificate     /etc/letsencrypt/live/geopulse.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geopulse.it/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
