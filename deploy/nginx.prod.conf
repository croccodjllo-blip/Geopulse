# Produzione GeoPulse — /etc/nginx/sites-available/aio-bot
# Domini: geopulse.it / www.geopulse.it
# TLS: Let's Encrypt via certbot (non sovrascrivere i path certificato a mano).
#
# Setup iniziale (una volta):
#   certbot --nginx -d geopulse.it -d www.geopulse.it --redirect
#
# Dopo certbot la config include listen 443 ssl + redirect 80→443.
# Questo file è un riferimento; in produzione certbot può aver modificato
# /etc/nginx/sites-enabled/aio-bot.

# HTTP → HTTPS (gestito da certbot; tenuto qui come riferimento)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name geopulse.it www.geopulse.it;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name geopulse.it www.geopulse.it;

    # Path tipici Let's Encrypt (aggiornati da certbot)
    ssl_certificate     /etc/letsencrypt/live/geopulse.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geopulse.it/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    # X-Frame / nosniff / Referrer / CSP li imposta l'app Flask (evitare doppioni).

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
