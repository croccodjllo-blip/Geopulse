# Nginx host legacy — geopulse.it redirige a Centropic.
# Produzione completa: vedi nginx.prod.conf (apex centropic.ai + 301 legacy).
# HTTPS: certbot --nginx -d centropic.ai -d www.centropic.ai \
#   -d geopulse.it -d www.geopulse.it  (SAN multi-nome)

server {
    listen 80;
    listen [::]:80;
    server_name geopulse.it www.geopulse.it;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://centropic.ai$request_uri;
    }
}
