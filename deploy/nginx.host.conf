# Nginx host per GeoPulse (geopulse.it).
# Copia in /etc/nginx/sites-available/aio-bot e abilita il sito.
# Poi configura HTTPS con: certbot --nginx -d geopulse.it -d www.geopulse.it

server {
    listen 80;
    server_name geopulse.it www.geopulse.it;

    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
