<script type="application/ld+json" nonce="{{ csp_nonce }}">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "@id": "{{ canonical_base }}/faq#faq",
  "url": "{{ canonical_base }}/faq",
  "inLanguage": "{{ schema_in_language }}",
  "isPartOf": { "@id": "{{ canonical_base }}/#website" },
  "about": { "@id": "{{ canonical_base }}/#organization" },
  "mainEntity": [
    {
      "@type": "Question",
      "name": {{ _('Cos’è AIO e GEO in Centropic?')|tojson }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ _('AIO = AI-Driven Visibility; GEO = Generative Engine Optimization. Non GIS, non All-in-One.')|tojson }}
      }
    },
    {
      "@type": "Question",
      "name": {{ _('Quale piano scegliere: Free, Plus o Business?')|tojson }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ _('Free: 1 dominio. Plus a %(plus)s€ Tasse escluse: fino a %(sites_plus)s domini, re-scan e SoV Misurato. Business a %(business)s€ Tasse escluse: API, white-label e fino a %(sites_business)s domini clienti.', plus=('%.2f'|format(plus_monthly_eur)|replace('.', ',')), sites_plus=max_sites_plus, business=('%.2f'|format(business_monthly_eur)|replace('.', ',')), sites_business=max_sites_business)|tojson }}
      }
    },
    {
      "@type": "Question",
      "name": {{ _('API e white-label sono in Plus?')|tojson }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ _('No. API /api/v1 e white-label sono riservati a Business. Plus include SoV Misurato, re-scan ed Edge completo.')|tojson }}
      }
    },
    {
      "@type": "Question",
      "name": {{ _('Gli score AIO e GEO sono misurazioni live sulle IA?')|tojson }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ _('Misurano la predisposizione strutturale (leggibilità per crawler generativi), con badge Stimato. Misurato richiede Plus/Business e citation monitor.')|tojson }}
      }
    },
    {
      "@type": "Question",
      "name": {{ _('Cos’è Edge Signals (hosting dinamico)?')|tojson }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ _('Endpoint pubblici Centropic (/e/<token>/llms.txt, signals.json; su Plus/Business anche robots.txt/JSON-LD live e snippet Worker/Vercel.')|tojson }}
      }
    },
    {
      "@type": "Question",
      "name": {{ _('Come vi contatto?')|tojson }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ _('Scrivi a info@centropic.ai per supporto, partnership o onboarding Business.')|tojson }}
      }
    }
  ]
}
</script>
