<script type="application/ld+json" nonce="{{ csp_nonce }}">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "@id": "{{ canonical_base }}/faq#faq",
  "url": "{{ canonical_base }}/faq",
  "inLanguage": "it-IT",
  "isPartOf": { "@id": "{{ canonical_base }}/#website" },
  "about": { "@id": "{{ canonical_base }}/#organization" },
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Cos’è AIO e GEO in Centropic?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "AIO = AI-Driven Visibility; GEO = Generative Engine Optimization. Non GIS, non All-in-One."
      }
    },
    {
      "@type": "Question",
      "name": "Quale piano scegliere: Free, Plus o Business?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Free: 1 dominio. Plus a {{ '%.2f'|format(plus_monthly_eur)|replace('.', ',') }}€ Tasse escluse: fino a {{ max_sites_plus }} domini, re-scan e SoV Misurato. Business a {{ '%.2f'|format(business_monthly_eur)|replace('.', ',') }}€ Tasse escluse: API, white-label e fino a {{ max_sites_business }} domini clienti."
      }
    },
    {
      "@type": "Question",
      "name": "API e white-label sono in Plus?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. API /api/v1 e white-label sono riservati a Business. Plus include SoV Misurato, re-scan ed Edge completo."
      }
    },
    {
      "@type": "Question",
      "name": "Gli score AIO e GEO sono misurazioni live sulle IA?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Misurano la predisposizione strutturale (leggibilità per crawler generativi), con badge Stimato. Misurato richiede Plus/Business e citation monitor."
      }
    },
    {
      "@type": "Question",
      "name": "Cos’è Edge Signals (hosting dinamico)?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Endpoint pubblici Centropic (/e/<token>/llms.txt, signals.json; su Plus/Business anche robots.txt/JSON-LD live e snippet Worker/Vercel)."
      }
    },
    {
      "@type": "Question",
      "name": "Come vi contatto?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Scrivi a info@centropic.ai per supporto, partnership o onboarding Business."
      }
    }
  ]
}
</script>
