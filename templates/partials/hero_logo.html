{# Inline mark so the orbital satellite can move (img SVG cannot be keyed by CSS). #}
<svg
  class="hero-brand-mark"
  viewBox="0 0 128 128"
  width="128"
  height="128"
  overflow="visible"
  role="img"
  aria-hidden="true"
  focusable="false"
>
  <defs>
    <linearGradient id="heroCWarm" x1="8%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#F4D7A8"/>
      <stop offset="38%" stop-color="#E8A04A"/>
      <stop offset="72%" stop-color="#C47A2C"/>
      <stop offset="100%" stop-color="#8A4E16"/>
    </linearGradient>
    <linearGradient id="heroCWarm2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A85E1C"/>
      <stop offset="50%" stop-color="#E8A04A"/>
      <stop offset="100%" stop-color="#F6E0B8"/>
    </linearGradient>
  </defs>
  <g class="hero-brand-orbit" transform="rotate(-18 64 64)">
    <ellipse
      class="hero-brand-orbit__ring"
      cx="64"
      cy="64"
      rx="54"
      ry="22"
      fill="none"
      stroke="url(#heroCWarm2)"
      stroke-width="1.15"
      stroke-dasharray="3 5"
      opacity="0.7"
    />
    {# Static rest pose — shown only when motion is reduced #}
    <circle class="hero-brand-orbit__sat hero-brand-orbit__sat--static" cx="114.5" cy="51" r="3.2" fill="#E8A04A"/>
    <circle class="hero-brand-orbit__sat hero-brand-orbit__sat--live" r="3.2" fill="#E8A04A">
      <animateMotion
        dur="16s"
        repeatCount="indefinite"
        rotate="0"
        path="M 118,64 A 54 22 0 1 1 10,64 A 54 22 0 1 1 118,64"
      />
    </circle>
  </g>
  <path d="M102 30 A50 50 0 1 0 102 98" fill="none" stroke="url(#heroCWarm)" stroke-width="9.5" stroke-linecap="round"/>
  <path d="M92 38 A38 38 0 1 0 92 90" fill="none" stroke="url(#heroCWarm2)" stroke-width="7.5" stroke-linecap="round"/>
  <path d="M82 47 A26 26 0 1 0 82 81" fill="none" stroke="url(#heroCWarm)" stroke-width="6.5" stroke-linecap="round"/>
</svg>
