<script type="application/ld+json" nonce="{{ csp_nonce }}">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "@id": "{{ canonical_base }}/#faq-home",
  "url": "{{ canonical_base }}/",
  "inLanguage": "it-IT",
  "isPartOf": { "@id": "{{ canonical_base }}/#website" },
  "about": { "@id": "{{ canonical_base }}/#organization" },
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Cosa significano AIO e GEO in Centropic?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "AIO (AI-Driven Visibility) indica quanto modelli e crawler IA possono interpretare il brand sul dominio. GEO (Generative Engine Optimization) indica quanto il sito è strutturato per essere citato nelle risposte generate. Non corrispondono a GIS né a suite All-in-One."
      }
    },
    {
      "@type": "Question",
      "name": "Quale piano mi serve?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Free: 1 dominio. Plus a {{ '%.2f'|format(plus_monthly_eur)|replace('.', ',') }}€/mese Tasse escluse: fino a {{ max_sites_plus }} domini, re-scan e SoV Misurato. Business a {{ '%.2f'|format(business_monthly_eur)|replace('.', ',') }}€/mese Tasse escluse: API, white-label e fino a {{ max_sites_business }} domini clienti."
      }
    },
    {
      "@type": "Question",
      "name": "Gli score rappresentano menzioni live sui modelli?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Misurano la predisposizione strutturale del sito per i crawler generativi. Di default sono etichettati Stimato; su Plus e Business i probe LLM possono aggiungere menzioni Misurate. Non vendiamo un ranking fisso nelle UI di terzi."
      }
    },
    {
      "@type": "Question",
      "name": "Come posso contattarvi?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Scrivi a info@centropic.ai oppure usa la pagina Contatti su centropic.ai/contatti."
      }
    }
  ]
}
</script>
