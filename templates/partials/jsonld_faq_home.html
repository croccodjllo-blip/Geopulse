<script type="application/ld+json" nonce="{{ csp_nonce }}">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "@id": "{{ canonical_base }}/#faq-home",
  "url": "{{ canonical_base }}/",
  "inLanguage": "{{ schema_in_language }}",
  "isPartOf": { "@id": "{{ canonical_base }}/#website" },
  "about": { "@id": "{{ canonical_base }}/#organization" },
  "mainEntity": [
    {
      "@type": "Question",
      "name": {{ _('Cosa significano AIO e GEO in Centropic?')|tojson }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ _('AIO (AI-Driven Visibility) indica quanto modelli e crawler IA possono interpretare il brand sul dominio. GEO (Generative Engine Optimization) indica quanto il sito è strutturato per essere citato nelle risposte generate. Non corrispondono a GIS né a suite All-in-One.')|tojson }}
      }
    },
    {
      "@type": "Question",
      "name": {{ _('Quale piano mi serve?')|tojson }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ _('Free: 1 dominio. Plus a %(plus)s€/mese Tasse escluse: fino a %(sites_plus)s domini, re-scan e SoV Misurato. Business a %(business)s€/mese Tasse escluse: API, white-label e fino a %(sites_business)s domini clienti.', plus=('%.2f'|format(plus_monthly_eur)|replace('.', ',')), sites_plus=max_sites_plus, business=('%.2f'|format(business_monthly_eur)|replace('.', ',')), sites_business=max_sites_business)|tojson }}
      }
    },
    {
      "@type": "Question",
      "name": {{ _('Gli score rappresentano menzioni live sui modelli?')|tojson }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ _('Misurano la predisposizione strutturale del sito per i crawler generativi. Di default sono etichettati Stimato; su Plus e Business i probe LLM possono aggiungere menzioni Misurate. Non vendiamo un ranking fisso nelle UI di terzi.')|tojson }}
      }
    },
    {
      "@type": "Question",
      "name": {{ _('Come posso contattarvi?')|tojson }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ _('Scrivi a info@centropic.ai oppure usa la pagina Contatti su centropic.ai/contatti.')|tojson }}
      }
    }
  ]
}
</script>
