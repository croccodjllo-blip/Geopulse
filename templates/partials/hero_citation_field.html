<svg class="hero-cite-svg" viewBox="0 0 920 560" preserveAspectRatio="xMaxYMid meet" role="img" aria-label="Mappa citazioni AI in stile holomap">
  <defs>
    <radialGradient id="hcf-holo" cx="58%" cy="52%" r="55%">
      <stop offset="0%" stop-color="#C9D3DD" stop-opacity="0.16"/>
      <stop offset="40%" stop-color="#5B6B7A" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#04060A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hcf-core" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#2A3440"/>
      <stop offset="50%" stop-color="#10161E"/>
      <stop offset="100%" stop-color="#070A10"/>
    </radialGradient>
    <linearGradient id="hcf-chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7FAFC"/>
      <stop offset="45%" stop-color="#C9D3DD"/>
      <stop offset="100%" stop-color="#5B6B7A"/>
    </linearGradient>
    <linearGradient id="hcf-hyper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9D3DD" stop-opacity="0"/>
      <stop offset="55%" stop-color="#E8EEF4" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#C9D3DD" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hcf-scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9D3DD" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C9D3DD" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C9D3DD" stop-opacity="0"/>
    </linearGradient>
    <filter id="hcf-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hcf-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5.5" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="920" height="560" fill="#04060A" fill-opacity="0"/>
  <rect width="920" height="560" fill="url(#hcf-holo)"/>

  <!-- Hyperspace streaks -->
  <g stroke="url(#hcf-hyper)" stroke-linecap="round" opacity="0.55">
    <line x1="40" y1="120" x2="300" y2="95" stroke-width="0.7"/>
    <line x1="60" y1="160" x2="280" y2="148" stroke-width="0.5"/>
    <line x1="640" y1="80" x2="900" y2="60" stroke-width="0.6"/>
    <line x1="680" y1="110" x2="890" y2="98" stroke-width="0.45"/>
    <line x1="40" y1="440" x2="260" y2="470" stroke-width="0.55"/>
    <line x1="700" y1="480" x2="900" y2="500" stroke-width="0.5"/>
  </g>

  <!-- Starfield -->
  <g fill="#E8EEF4">
    <circle cx="90" cy="70" r="1.1" opacity="0.55"/>
    <circle cx="150" cy="130" r="0.7" opacity="0.35"/>
    <circle cx="210" cy="50" r="0.9" opacity="0.4"/>
    <circle cx="780" cy="70" r="1" opacity="0.5"/>
    <circle cx="840" cy="140" r="0.7" opacity="0.3"/>
    <circle cx="880" cy="210" r="0.8" opacity="0.4"/>
    <circle cx="100" cy="500" r="0.8" opacity="0.35"/>
    <circle cx="860" cy="460" r="1" opacity="0.45"/>
    <circle cx="320" cy="80" r="0.6" opacity="0.3"/>
    <circle cx="600" cy="50" r="0.7" opacity="0.35"/>
  </g>

  <!-- Targeting rings (tactical reticle) -->
  <g transform="translate(520 255)" fill="none" stroke="url(#hcf-chrome)">
    <circle r="118" stroke-width="0.7" opacity="0.22" stroke-dasharray="2 10"/>
    <circle r="86" stroke-width="1" opacity="0.4" stroke-dasharray="28 14 4 14"/>
    <circle r="58" stroke-width="1.3" opacity="0.7"/>
    <!-- crosshair ticks -->
    <g stroke-width="1.1" opacity="0.65">
      <line x1="0" y1="-72" x2="0" y2="-58"/>
      <line x1="0" y1="58" x2="0" y2="72"/>
      <line x1="-72" y1="0" x2="-58" y2="0"/>
      <line x1="58" y1="0" x2="72" y2="0"/>
    </g>
    <!-- corner brackets -->
    <g stroke-width="1.35" opacity="0.8">
      <path d="M-42 -42 H-28 M-42 -42 V-28"/>
      <path d="M42 -42 H28 M42 -42 V-28"/>
      <path d="M-42 42 H-28 M-42 42 V28"/>
      <path d="M42 42 H28 M42 42 V28"/>
    </g>
  </g>

  <!-- Orbital flight paths -->
  <g transform="translate(520 255)" fill="none" stroke="#5B6B7A" opacity="0.35">
    <ellipse cx="0" cy="0" rx="210" ry="120" stroke-width="0.8" stroke-dasharray="3 9" transform="rotate(-18)"/>
    <ellipse cx="0" cy="0" rx="270" ry="150" stroke-width="0.65" stroke-dasharray="1 11" transform="rotate(12)"/>
  </g>

  <!-- Scan bar -->
  <g class="hero-cite-svg__scan" opacity="0.5">
    <rect x="200" y="0" width="540" height="40" fill="url(#hcf-scan)"/>
  </g>

  <!-- Energy links -->
  <g filter="url(#hcf-soft)" stroke="url(#hcf-hyper)" stroke-width="1.25" fill="none" stroke-linecap="round">
    <path d="M520 255 C 420 270, 320 300, 240 345"/>
    <path d="M520 255 C 470 320, 440 370, 420 420"/>
    <path d="M520 255 C 580 320, 620 370, 660 415"/>
    <path d="M520 255 C 620 270, 710 285, 780 305"/>
    <path d="M520 255 C 420 210, 320 175, 230 155"/>
  </g>

  <!-- Engine pods — fighter-bay style capsules -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(240 345)">
      <rect x="-56" y="-15" width="112" height="30" rx="4" fill="#0A0E14" stroke="url(#hcf-chrome)" stroke-width="1.15"/>
      <rect x="-56" y="-15" width="6" height="30" fill="#C9D3DD" opacity="0.35"/>
      <circle cx="-38" cy="0" r="3.5" fill="#C9D3DD" filter="url(#hcf-glow)"/>
      <text x="8" y="4" text-anchor="middle" fill="#E8EEF4" font-size="11.5" font-weight="600" letter-spacing="0.06em">CHATGPT</text>
    </g>
    <g transform="translate(230 155)">
      <rect x="-48" y="-13" width="96" height="26" rx="4" fill="#0A0E14" stroke="#5B6B7A" stroke-width="1"/>
      <rect x="-48" y="-13" width="5" height="26" fill="#8BA3BD" opacity="0.35"/>
      <circle cx="-32" cy="0" r="3" fill="#8BA3BD"/>
      <text x="6" y="4" text-anchor="middle" fill="#C8CDD5" font-size="11" font-weight="500" letter-spacing="0.06em">CLAUDE</text>
    </g>
    <g transform="translate(420 420)">
      <rect x="-54" y="-13" width="108" height="26" rx="4" fill="#0A0E14" stroke="#5B6B7A" stroke-width="1"/>
      <rect x="-54" y="-13" width="5" height="26" fill="#8BA3BD" opacity="0.35"/>
      <circle cx="-36" cy="0" r="3" fill="#8BA3BD"/>
      <text x="6" y="4" text-anchor="middle" fill="#C8CDD5" font-size="11" font-weight="500" letter-spacing="0.05em">PERPLEXITY</text>
    </g>
    <g transform="translate(660 415)">
      <rect x="-48" y="-13" width="96" height="26" rx="4" fill="#0A0E14" stroke="#5B6B7A" stroke-width="1"/>
      <rect x="-48" y="-13" width="5" height="26" fill="#8BA3BD" opacity="0.35"/>
      <circle cx="-32" cy="0" r="3" fill="#8BA3BD"/>
      <text x="6" y="4" text-anchor="middle" fill="#C8CDD5" font-size="11" font-weight="500" letter-spacing="0.06em">GEMINI</text>
    </g>
    <g transform="translate(780 305)">
      <rect x="-50" y="-13" width="100" height="26" rx="4" fill="#0A0E14" stroke="#5B6B7A" stroke-width="1"/>
      <rect x="-50" y="-13" width="5" height="26" fill="#8BA3BD" opacity="0.35"/>
      <circle cx="-34" cy="0" r="3" fill="#8BA3BD"/>
      <text x="6" y="4" text-anchor="middle" fill="#C8CDD5" font-size="11" font-weight="500" letter-spacing="0.06em">COPILOT</text>
    </g>

    <!-- Core reactor — geometric, no copy -->
    <g transform="translate(520 255)">
      <circle r="36" fill="url(#hcf-core)" stroke="url(#hcf-chrome)" stroke-width="1.5"/>
      <circle r="36" fill="#C9D3DD" opacity="0.05"/>
      <!-- inner hex -->
      <path d="M0 -22 L19 -11 L19 11 L0 22 L-19 11 L-19 -11 Z"
            fill="none" stroke="#C9D3DD" stroke-width="1" opacity="0.7"/>
      <circle r="7" fill="#C9D3DD" filter="url(#hcf-glow)"/>
      <circle r="2.5" fill="#F7FAFC"/>
    </g>
  </g>

  <!-- HUD chrome caption -->
  <g font-family="IBM Plex Mono, ui-monospace, monospace" fill="#8B97A8" font-size="10" letter-spacing="0.28em">
    <text x="72" y="48">SECTOR · AI ENGINES</text>
    <text x="848" y="48" text-anchor="end">SCAN ACTIVE</text>
  </g>
  <g stroke="url(#hcf-chrome)" stroke-width="0.9" opacity="0.4">
    <line x1="72" y1="58" x2="196" y2="58"/>
    <line x1="724" y1="58" x2="848" y2="58"/>
  </g>
</svg>
