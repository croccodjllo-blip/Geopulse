{# Nonced CSS custom properties for Signal deck meters (no style= attrs). #}
<style nonce="{{ csp_nonce }}">
{% if rating is defined and rating %}
.dash-signal { --cvi: {{ rating.score if rating.score is number else 0 }}; }
{% endif %}
{% if engine_breakdown %}
.dash-signal { --sov: {{ engine_breakdown.brand_sov }}; }
{% for e in engine_breakdown.engines %}
[data-engine="{{ e.id }}"] {
  --accent: {{ e.accent }};
  --p: {{ e.propensity if e.propensity is not none else 0 }};
  --share: {{ e.share }};
}
{% endfor %}
{% endif %}
</style>
