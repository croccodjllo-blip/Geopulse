{# Nonced CSS custom properties for SoV share bars (no style= attrs). #}
<style nonce="{{ csp_nonce }}">
{% if engine_breakdown %}
.dash-hero__sov,
.dash-ring--sov { --sov: {{ engine_breakdown.brand_sov }}; }
{% for e in engine_breakdown.engines %}
[data-engine="{{ e.id }}"] {
  --accent: {{ e.accent }};
  --p: {{ e.propensity if e.propensity is not none else 0 }};
  --share: {{ e.share }};
}
{% endfor %}
{% endif %}
</style>
