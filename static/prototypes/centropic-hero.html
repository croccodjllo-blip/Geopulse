<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Centropic · Hero</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              centropic: {
                chaos: "#0A0F24",
                core: "#00FF9D",
                flow: "#00D2FF",
                clarity: "#F5F7FA",
              },
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', "Inter", "system-ui", "sans-serif"],
            },
            backgroundImage: {
              "centropic-accent":
                "linear-gradient(90deg, #00D2FF 0%, #00FF9D 100%)",
            },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-centropic-chaos text-centropic-clarity font-sans antialiased">
    <section
      class="relative min-h-screen overflow-hidden bg-[#0A0F24]"
      aria-labelledby="hero-brand"
    >
      <div
        class="pointer-events-none absolute inset-0 bg-[radial-gradient(ellipse_55%_50%_at_70%_20%,rgba(0,210,255,0.18),transparent_60%),radial-gradient(ellipse_45%_40%_at_20%_40%,rgba(0,255,157,0.12),transparent_55%)]"
        aria-hidden="true"
      ></div>

      <div class="relative z-10 mx-auto flex min-h-screen max-w-6xl flex-col justify-center px-6 py-24">
        <p id="hero-brand" class="mb-5 inline-flex flex-wrap items-center gap-3">
          <span class="text-sm font-extrabold tracking-[0.22em] text-[#F5F7FA]">CENTROPIC</span>
          <span
            class="rounded border border-[#00D2FF]/35 px-2 py-1 text-[0.68rem] font-bold uppercase tracking-[0.16em] text-[#00D2FF]"
            >Signal Intelligence</span
          >
        </p>

        <h1
          class="mb-5 max-w-[14ch] text-[clamp(2.6rem,8vw,5rem)] font-extrabold leading-[1.02] tracking-[-0.035em] text-[#F5F7FA]"
        >
          Bringing
          <span
            class="bg-centropic-accent bg-clip-text text-transparent"
            >Order</span
          >
          to Intelligence
        </h1>

        <p class="mb-8 max-w-[38ch] text-lg leading-relaxed text-[#F5F7FA]/70">
          We diagnose public domain signals and deliver machine-readable artifacts
          for brand citability across generative answer engines.
        </p>

        <div class="flex flex-wrap gap-3">
          <a
            href="/register"
            class="inline-flex min-h-11 items-center justify-center rounded-md bg-[#00FF9D] px-5 text-sm font-bold text-[#0A0F24] shadow-[0_0_0_0_rgba(0,255,157,0)] transition duration-200 hover:-translate-y-px hover:bg-[#3dffb3] hover:shadow-[0_0_0_1px_rgba(0,255,157,0.45),0_0_28px_rgba(0,255,157,0.45),0_0_56px_rgba(0,210,255,0.22)]"
          >
            Start diagnosis
          </a>
          <a
            href="/prodotto"
            class="inline-flex min-h-11 items-center justify-center rounded-md border border-white/20 bg-white/5 px-5 text-sm font-semibold text-[#F5F7FA]/90 transition hover:bg-white/10"
          >
            See the method
          </a>
        </div>
      </div>
    </section>
  </body>
</html>
