<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" fill="none" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="cite-line" x1="480" y1="360" x2="780" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6EC6C0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6EC6C0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cite-core" x1="480" y1="420" x2="480" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3D8F8A"/>
      <stop offset="1" stop-color="#9FE8E2"/>
    </linearGradient>
    <radialGradient id="cite-glow" cx="480" cy="360" r="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6EC6C0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6EC6C0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="720" fill="#04060A"/>
  <circle cx="480" cy="360" r="220" fill="url(#cite-glow)"/>

  <!-- Fiduciary frame -->
  <path d="M72 120 V72 H120" stroke="#2A3542" stroke-width="1.5"/>
  <path d="M888 120 V72 H840" stroke="#2A3542" stroke-width="1.5"/>
  <path d="M72 600 V648 H120" stroke="#2A3542" stroke-width="1.5"/>
  <path d="M888 600 V648 H840" stroke="#2A3542" stroke-width="1.5"/>

  <!-- Range rings -->
  <circle cx="480" cy="360" r="88" stroke="#1A222D" stroke-width="1"/>
  <circle cx="480" cy="360" r="160" stroke="#1A222D" stroke-width="1" stroke-dasharray="3 8"/>
  <circle cx="480" cy="360" r="240" stroke="#1A222D" stroke-width="1" opacity="0.7"/>

  <!-- Citation edges brand ’ engines -->
  <path d="M480 360 L760 168" stroke="url(#cite-line)" stroke-width="1.5"/>
  <path d="M480 360 L820 360" stroke="#6EC6C0" stroke-width="1.25" stroke-opacity="0.35"/>
  <path d="M480 360 L720 560" stroke="#6EC6C0" stroke-width="1.25" stroke-opacity="0.28"/>
  <path d="M480 360 L240 200" stroke="#4A7C8C" stroke-width="1.25" stroke-opacity="0.35"/>
  <path d="M480 360 L180 420" stroke="#4A7C8C" stroke-width="1.15" stroke-opacity="0.25"/>

  <!-- Engine nodes -->
  <g font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" letter-spacing="0.08em">
    <circle cx="760" cy="168" r="7" fill="#6EC6C0"/>
    <text x="776" y="172" fill="#C5D0DC">CHATGPT</text>
    <circle cx="820" cy="360" r="6" fill="#6EC6C0" fill-opacity="0.85"/>
    <text x="836" y="364" fill="#8B97A8">CLAUDE</text>
    <circle cx="720" cy="560" r="6" fill="#6EC6C0" fill-opacity="0.7"/>
    <text x="736" y="564" fill="#8B97A8">PERPLEXITY</text>
    <circle cx="240" cy="200" r="5.5" fill="#4A7C8C"/>
    <text x="180" y="186" fill="#8B97A8" text-anchor="end">GEMINI</text>
    <circle cx="180" cy="420" r="5" fill="#4A7C8C" fill-opacity="0.8"/>
    <text x="120" y="424" fill="#8B97A8" text-anchor="end">GROK</text>
  </g>

  <!-- Brand nucleus -->
  <circle cx="480" cy="360" r="34" stroke="#6EC6C0" stroke-width="1.5" fill="#0A0E14"/>
  <circle cx="480" cy="360" r="10" fill="url(#cite-core)"/>
  <text x="480" y="412" text-anchor="middle" fill="#E8EEF4" font-family="Space Grotesk, IBM Plex Sans, sans-serif" font-size="13" font-weight="600" letter-spacing="0.16em">BRAND</text>

  <!-- SoV readout -->
  <text x="72" y="96" fill="#6EC6C0" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="0.14em">SOV MEASURED</text>
  <text x="72" y="118" fill="#E8EEF4" font-family="Space Grotesk, sans-serif" font-size="28" font-weight="700">42.8%</text>
  <text x="72" y="140" fill="#8B97A8" font-family="IBM Plex Sans, sans-serif" font-size="12">mention rate · 5 engines</text>
</svg>
