<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="Centropic holographic emblem">
  <defs>
    <linearGradient id="hm-cyan" x1="20" y1="110" x2="108" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0066FF"/>
      <stop offset="0.45" stop-color="#00F0FF"/>
      <stop offset="1" stop-color="#8A2BE2"/>
    </linearGradient>
    <linearGradient id="hm-metal" x1="32" y1="96" x2="96" y2="28" gradientUnits="userSpaceOnUse">
