<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">Share of Voice</title>
  <desc id="d">Proxy vs Measured</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04060A"/>
      <stop offset="55%" stop-color="#0A0E14"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9D3DD" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C9D3DD" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#C9D3DD" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <circle cx="820" cy="90" r="160" fill="#C9D3DD" opacity=".06"/>
  <circle cx="120" cy="460" r="140" fill="#5B6B7A" opacity=".05"/>
  <rect x="36" y="36" width="888" height="468" rx="22" fill="#0A0E14" stroke="#1A222D" stroke-width="1.5"/>
  <rect x="36" y="36" width="888" height="4" fill="url(#glow)"/>
  <text x="64" y="88" fill="#C9D3DD" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="2">SHARE OF VOICE</text>
  <text x="64" y="122" fill="#E8EEF4" font-family="'Inter', system-ui, sans-serif" font-size="28" font-weight="700">Proxy vs Measured</text>
  
  <g font-family="'Inter', system-ui, sans-serif">
    <rect x="64" y="170" width="400" height="240" rx="16" fill="#0A0E14" stroke="#1A222D"/>
    <text x="88" y="210" fill="#F59E0B" font-size="12" font-weight="700">STIMATO (proxy)</text>
    <text x="88" y="250" fill="#E8EEF4" font-size="22" font-weight="700">Euristiche sui segnali</text>
    <text x="88" y="285" fill="#8B97A8" font-size="14">Disponibile su Free, Plus e Business</text>
    <text x="88" y="320" fill="#8B97A8" font-size="14">Engine breakdown etichettato</text>
    <text x="88" y="355" fill="#8B97A8" font-size="14">Non è citazione live</text>

    <rect x="496" y="170" width="400" height="240" rx="16" fill="#0A0E14" stroke="#C9D3DD" stroke-opacity=".55"/>
    <text x="520" y="210" fill="#C9D3DD" font-size="12" font-weight="700">MISURATO (Plus/Business)</text>
    <text x="520" y="250" fill="#E8EEF4" font-size="22" font-weight="700">Citation monitor</text>
    <text x="520" y="285" fill="#8B97A8" font-size="14">Prompt bank → LLM APIs</text>
    <text x="520" y="320" fill="#8B97A8" font-size="14">Conteggio menzioni brand</text>
    <text x="520" y="355" fill="#22C55E" font-size="14" font-weight="700">Campione probe, non ranking UI</text>
  </g>

  <text x="64" y="480" fill="#8B97A8" font-family="'Inter', system-ui, sans-serif" font-size="12">Centropic · guida prodotto</text>
</svg>
