  <text x="64" y="88" fill="#6EC6C0" font-family=""IBM Plex Sans", system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="2">API & AGENCY</text>
  <text x="64" y="122" fill="#E8EEF7" font-family=""IBM Plex Sans", system-ui, sans-serif" font-size="28" font-weight="700">Automazione e white-label</text>
  
