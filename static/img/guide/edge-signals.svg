  <text x="64" y="88" fill="#C9D3DD" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="2">EDGE SIGNALS</text>
  <text x="64" y="122" fill="#E8EEF4" font-family="'Inter', system-ui, sans-serif" font-size="28" font-weight="700">Hosting dinamico /e/token</text>
  
  <g font-family="'Inter', system-ui, sans-serif">
