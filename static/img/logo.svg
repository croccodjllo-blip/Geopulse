<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="Centropic">
  <defs>
    <linearGradient id="holo-cyan" x1="20" y1="110" x2="108" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0066FF"/>
      <stop offset="0.45" stop-color="#00F0FF"/>
      <stop offset="1" stop-color="#8A2BE2"/>
    </linearGradient>
    <linearGradient id="holo-metal" x1="32" y1="96" x2="96" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DD3FC" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#00F0FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8A2BE2" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="holo-core" cx="50%" cy="58%" r="42%">
      <stop stop-color="#00F0FF" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#0066FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8A2BE2" stop-opacity="0"/>
    </radialGradient>
    <filter id="holo-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="holo-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Liquid chrome disc -->
  <circle cx="64" cy="64" r="58" fill="#080B10" stroke="url(#holo-metal)" stroke-width="1.2"/>
  <circle cx="64" cy="64" r="52" stroke="#00F0FF" stroke-opacity="0.12" stroke-width="0.8"/>

  <!-- Quantum entropic vortex -->
  <g opacity="0.9" filter="url(#holo-glow)">
    <path d="M64 92c18-2 28-14 26-28s-16-22-28-20c-10 2-16 12-14 22" stroke="url(#holo-cyan)" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M64 86c14-1 22-11 20-22s-12-17-22-15c-8 1.5-12.5 9.5-11 17" stroke="#0066FF" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
    <path d="M64 80c10 0 16-8 14.5-15.5S70 54 64 55.5s-8.5 6.5-7.5 12" stroke="#8A2BE2" stroke-width="1.1" stroke-linecap="round" opacity="0.9"/>
    <path d="M48 70c4 14 16 22 30 18" stroke="#00F0FF" stroke-width="0.9" stroke-linecap="round" opacity="0.45"/>
    <path d="M78 72c-2 12-12 20-24 18" stroke="#8A2BE2" stroke-width="0.9" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Orbital trails -->
  <ellipse cx="64" cy="64" rx="40" ry="16" stroke="#00F0FF" stroke-opacity="0.28" stroke-width="0.9" transform="rotate(-28 64 64)"/>
  <ellipse cx="64" cy="64" rx="36" ry="14" stroke="#8A2BE2" stroke-opacity="0.22" stroke-width="0.8" transform="rotate(38 64 64)"/>
  <circle cx="98" cy="52" r="1.6" fill="#00F0FF" filter="url(#holo-soft)"/>
  <circle cx="34" cy="78" r="1.3" fill="#8A2BE2" filter="url(#holo-soft)"/>
  <circle cx="86" cy="88" r="1.1" fill="#0066FF"/>
  <circle cx="42" cy="42" r="1.1" fill="#00F0FF" opacity="0.8"/>

  <!-- Micro-circuitry -->
  <g stroke="#00F0FF" stroke-opacity="0.35" stroke-width="0.7" stroke-linecap="square">
    <path d="M22 48h10v6h6"/>
    <path d="M106 74h-9v-5h-5"/>
    <path d="M28 86h8m0 0v5m0-5h4"/>
    <path d="M96 40h-7m0 0v-4m0 4h-4"/>
    <circle cx="32" cy="54" r="1.2" fill="#00F0FF" fill-opacity="0.55" stroke="none"/>
    <circle cx="97" cy="69" r="1.2" fill="#8A2BE2" fill-opacity="0.55" stroke="none"/>
  </g>

  <!-- Faint binary stream -->
  <g fill="#00F0FF" fill-opacity="0.28" font-family="ui-monospace, monospace" font-size="5.2">
    <text x="18" y="34">01</text>
    <text x="102" y="30">10</text>
    <text x="16" y="102">11</text>
    <text x="100" y="104">01</text>
  </g>

  <!-- Core bloom -->
  <circle cx="64" cy="72" r="18" fill="url(#holo-core)" opacity="0.75"/>

  <!-- Ascending vector / arrow breaking out -->
  <g filter="url(#holo-glow)">
    <path
      d="M64 96V34"
      stroke="url(#holo-cyan)"
      stroke-width="3.2"
      stroke-linecap="round"
    />
    <path
      d="M64 22 L78 42 L64 36 L50 42 Z"
      fill="url(#holo-cyan)"
    />
    <path
      d="M64 28 L72 40 L64 37 L56 40 Z"
      fill="#FFFFFF"
      fill-opacity="0.35"
    />
  </g>

  <!-- Metallic shine highlight -->
  <path
    d="M40 38c8-10 24-14 38-8"
    stroke="#FFFFFF"
    stroke-opacity="0.22"
    stroke-width="1.4"
    stroke-linecap="round"
  />
</svg>
