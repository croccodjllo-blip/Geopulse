<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Centropic">
  <defs>
    <linearGradient id="cChrome" x1="12%" y1="8%" x2="90%" y2="92%">
      <stop offset="0%" stop-color="#E8EEF4"/>
      <stop offset="42%" stop-color="#C9D3DD"/>
      <stop offset="100%" stop-color="#5B6B7A"/>
    </linearGradient>
    <linearGradient id="cRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B6B7A"/>
      <stop offset="50%" stop-color="#C9D3DD"/>
      <stop offset="100%" stop-color="#8B98A8"/>
    </linearGradient>
    <radialGradient id="cVoid" cx="50%" cy="46%" r="54%">
      <stop offset="0%" stop-color="#1A222D"/>
      <stop offset="70%" stop-color="#0A0E14"/>
      <stop offset="100%" stop-color="#05070A"/>
    </radialGradient>
  </defs>

  <!-- Void disc -->
  <circle cx="64" cy="64" r="54" fill="url(#cVoid)" stroke="url(#cChrome)" stroke-width="3.2"/>

  <!-- Orbital rings -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="url(#cRing)" stroke-width="1.4" opacity="0.55"/>
  <ellipse cx="64" cy="64" rx="46" ry="20" transform="rotate(-28 64 64)"
    fill="none" stroke="url(#cRing)" stroke-width="1.5" stroke-dasharray="3.2 4.8" opacity="0.95"/>

  <!-- Satellite node -->
  <circle cx="102" cy="48" r="3.2" fill="#C9D3DD"/>
  <circle cx="102" cy="48" r="6" fill="#C9D3DD" opacity="0.22"/>

  <!-- Chrome C monogram -->
  <path d="M82 44.5 A22 22 0 1 0 82 83.5" fill="none" stroke="url(#cChrome)" stroke-width="9" stroke-linecap="round"/>
</svg>
