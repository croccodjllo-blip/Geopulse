  <path d="M91 37 A39 39 0 1 0 91 91" fill="none" stroke="url(#cChrome2)" stroke-width="7.2" stroke-linecap="round"/>
  <path d="M82 45 A27.5 27.5 0 1 0 82 83" fill="none" stroke="url(#cChrome)" stroke-width="6" stroke-linecap="round"/>
