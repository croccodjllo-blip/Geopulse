<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Centropic">
  <defs>
    <linearGradient id="cChrome" x1="12%" y1="4%" x2="88%" y2="96%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="22%" stop-color="#E8EEF4"/>
      <stop offset="48%" stop-color="#C9D3DD"/>
      <stop offset="72%" stop-color="#8B98A8"/>
      <stop offset="100%" stop-color="#4A5562"/>
    </linearGradient>
    <linearGradient id="cChrome2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B6B7A"/>
      <stop offset="35%" stop-color="#C9D3DD"/>
      <stop offset="65%" stop-color="#F2F5F8"/>
      <stop offset="100%" stop-color="#6E7C8C"/>
    </linearGradient>
    <filter id="cSoft" x="-20%" y="-20%" width="140%" height="140%">
