<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="Centropic">
  <defs>
    <linearGradient id="c-beam" x1="64" y1="102" x2="64" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2F6F6B"/>
      <stop offset="0.45" stop-color="#6EC6C0"/>
      <stop offset="1" stop-color="#D7F7F3"/>
    </linearGradient>
    <linearGradient id="c-orbit" x1="22" y1="96" x2="106" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4A7C8C"/>
      <stop offset="0.5" stop-color="#6EC6C0"/>
      <stop offset="1" stop-color="#A8C5C2"/>
    </linearGradient>
    <linearGradient id="c-chassis" x1="20" y1="108" x2="108" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0E14"/>
      <stop offset="1" stop-color="#121820"/>
    </linearGradient>
    <radialGradient id="c-glow" cx="64" cy="64" r="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6EC6C0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6EC6C0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Hex instrument chassis -->
  <path
    d="M64 8 L108 33 V95 L64 120 L20 95 V33 Z"
    fill="url(#c-chassis)"
    stroke="#1A222D"
    stroke-width="1.75"
  />
  <path
    d="M64 18 L98 38 V90 L64 110 L30 90 V38 Z"
    fill="#04060A"
    stroke="#2A3542"
    stroke-width="1"
  />

  <!-- Soft core aura (restrained) -->
  <circle cx="64" cy="64" r="34" fill="url(#c-glow)"/>

  <!-- Inclined orbital ellipse (futurist instrument) -->
  <ellipse
    cx="64" cy="64" rx="34" ry="18"
    transform="rotate(-28 64 64)"
    stroke="url(#c-orbit)"
    stroke-width="1.4"
    opacity="0.55"
  />
  <ellipse
    cx="64" cy="64" rx="34" ry="18"
    transform="rotate(-28 64 64)"
    stroke="#6EC6C0"
    stroke-width="1.5"
    stroke-dasharray="3 7"
    stroke-linecap="round"
    opacity="0.95"
  />

  <!-- Secondary counter-orbit -->
  <ellipse
    cx="64" cy="64" rx="22" ry="30"
    transform="rotate(18 64 64)"
    stroke="#4A7C8C"
    stroke-width="0.9"
    opacity="0.45"
  />

  <!-- Precision aperture -->
  <circle cx="64" cy="64" r="15" stroke="#2A3542" stroke-width="1.1"/>
  <circle cx="64" cy="64" r="15" stroke="#6EC6C0" stroke-width="0.75" stroke-dasharray="2 5" opacity="0.7"/>

  <!-- Ascending citation beam -->
  <path d="M64 98 V42" stroke="url(#c-beam)" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Crystal tip stack -->
  <path d="M64 20 L74 38 H54 Z" fill="url(#c-beam)"/>
  <path d="M64 28 L69 38 H59 Z" fill="#04060A" opacity="0.35"/>

  <!-- Telemetry ticks -->
  <path d="M42 64 H52 M76 64 H86" stroke="#8BA3B5" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>
  <path d="M48 52 L52 56 M80 52 L76 56 M48 76 L52 72 M80 76 L76 72" stroke="#4A7C8C" stroke-width="1.2" stroke-linecap="round" opacity="0.65"/>

  <!-- Core node -->
  <circle cx="64" cy="64" r="4.2" fill="#6EC6C0"/>
  <circle cx="64" cy="64" r="1.8" fill="#04060A"/>

  <!-- Orbit satellite nodes -->
  <circle cx="92" cy="50" r="2.1" fill="#6EC6C0"/>
  <circle cx="38" cy="78" r="1.7" fill="#4A7C8C"/>
</svg>
