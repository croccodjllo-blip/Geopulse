<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="GeoPulse">
  <defs>
    <linearGradient id="gp-plate" x1="96" y1="32" x2="416" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#121A2B"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="gp-ring" x1="120" y1="100" x2="400" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B9CF8"/>
      <stop offset="50%" stop-color="#4F6EF7"/>
      <stop offset="100%" stop-color="#3B55E0"/>
    </linearGradient>
    <linearGradient id="gp-orbit" x1="88" y1="256" x2="424" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F6EF7" stop-opacity="0.12"/>
      <stop offset="42%" stop-color="#A5B4FC" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#4F6EF7" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="gp-core" cx="46%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#C7D2FE"/>
      <stop offset="45%" stop-color="#4F6EF7"/>
      <stop offset="100%" stop-color="#2F48C9"/>
    </radialGradient>
    <radialGradient id="gp-node" cx="42%" cy="36%" r="68%">
      <stop offset="0%" stop-color="#E8EEF7"/>
      <stop offset="35%" stop-color="#A5B4FC"/>
      <stop offset="100%" stop-color="#4F6EF7"/>
    </radialGradient>
  </defs>

  <!-- App plate -->
  <rect width="512" height="512" rx="118" fill="url(#gp-plate)"/>
  <rect x="20" y="20" width="472" height="472" rx="102" fill="none" stroke="#243247" stroke-width="3"/>

  <!-- Soft depth disc -->
  <circle cx="256" cy="256" r="168" fill="#0F172A"/>

  <!-- Outer signal ring -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#gp-ring)" stroke-width="20" stroke-linecap="round"/>

  <!-- Geo meridian -->
  <ellipse cx="256" cy="256" rx="68" ry="148" fill="none" stroke="#64748B" stroke-width="9" opacity="0.55"/>

  <!-- Geo latitude -->
  <ellipse cx="256" cy="256" rx="148" ry="46" fill="none" stroke="#94A3B8" stroke-width="8" opacity="0.42"/>

  <!-- Pulse orbit -->
  <ellipse
    cx="256"
    cy="256"
    rx="172"
    ry="58"
    fill="none"
    stroke="url(#gp-orbit)"
    stroke-width="15"
    stroke-linecap="round"
    transform="rotate(-32 256 256)"
  />

  <!-- Cardinal ticks -->
  <g stroke="#818CF8" stroke-width="14" stroke-linecap="round" opacity="0.9">
    <path d="M256 58v30"/>
    <path d="M256 424v30"/>
    <path d="M58 256h30"/>
    <path d="M424 256h30"/>
  </g>

  <!-- Center core -->
  <circle cx="256" cy="256" r="30" fill="url(#gp-core)"/>
  <circle cx="256" cy="256" r="11" fill="#F8FAFC" opacity="0.92"/>

  <!-- Pulse node on orbit (top-right) -->
  <circle cx="386" cy="188" r="26" fill="url(#gp-node)"/>
  <circle cx="386" cy="188" r="9" fill="#F8FAFC"/>
</svg>
