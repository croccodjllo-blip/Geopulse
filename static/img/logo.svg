<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="Centropic">
  <defs>
    <linearGradient id="c-steel" x1="24" y1="104" x2="104" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8BA3B5"/>
      <stop offset="0.55" stop-color="#6EC6C0"/>
      <stop offset="1" stop-color="#A8B4C0"/>
    </linearGradient>
    <linearGradient id="c-core" x1="64" y1="88" x2="64" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3D8F8A"/>
      <stop offset="1" stop-color="#9FE8E2"/>
    </linearGradient>
  </defs>

  <!-- Void disc -->
  <circle cx="64" cy="64" r="58" fill="#04060A" stroke="#1A222D" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="50" stroke="#2A3542" stroke-width="0.75" opacity="0.9"/>

  <!-- Formal orbital ring -->
  <circle cx="64" cy="64" r="38" stroke="url(#c-steel)" stroke-width="1.25" opacity="0.55"/>
  <circle cx="64" cy="64" r="38" stroke="#6EC6C0" stroke-width="1.25" stroke-dasharray="4 10" opacity="0.85" stroke-linecap="round"/>

  <!-- Inner architecture ring -->
  <circle cx="64" cy="64" r="26" stroke="#2A3542" stroke-width="1"/>

  <!-- Ascending signal axis -->
  <path d="M64 92 V36" stroke="url(#c-core)" stroke-width="3" stroke-linecap="round"/>
  <path d="M64 28 L72 42 H56 Z" fill="url(#c-core)"/>

  <!-- Cross-axis ticks (instrumentation) -->
  <path d="M48 64 H56 M72 64 H80" stroke="#8BA3B5" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <circle cx="64" cy="64" r="3.2" fill="#6EC6C0"/>
  <circle cx="64" cy="64" r="1.4" fill="#04060A"/>

  <!-- Corner fiduciary marks -->
  <path d="M28 40 V32 H36" stroke="#3D4A58" stroke-width="1.2" stroke-linecap="square"/>
  <path d="M100 40 V32 H92" stroke="#3D4A58" stroke-width="1.2" stroke-linecap="square"/>
  <path d="M28 88 V96 H36" stroke="#3D4A58" stroke-width="1.2" stroke-linecap="square"/>
  <path d="M100 88 V96 H92" stroke="#3D4A58" stroke-width="1.2" stroke-linecap="square"/>
</svg>
