services:
  aio-bot:
    build: .
    image: aio-bot:latest
    container_name: aio-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8000"
      # Prefer Postgres in production. SQLite forces WEB_CONCURRENCY=1 in entrypoint.
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/database.db}
      FLASK_DEBUG: "0"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      WEB_THREADS: ${WEB_THREADS:-4}
      # Optional: point at the `redis` profile service (or an external Redis)
      # for analyze-queue dispatch + shared RPM. Empty = DB FIFO fallback.
      REDIS_URL: ${REDIS_URL:-}
    volumes:
      - aio_bot_data:/data
    # Bind localhost only so X-Forwarded-* cannot be spoofed via the published port.
    # Nginx/Caddy on the host proxies to 127.0.0.1:HOST_PORT.
    ports:
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Redis opzionale (dispatch code + RPM condiviso): docker compose --profile redis up -d
  # Senza REDIS_URL/profilo attivo i worker usano il fallback DB FIFO.
  redis:
    profiles: ["redis"]
    image: redis:7-alpine
    container_name: aio-bot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - aio_bot_redis:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Postgres opzionale: docker compose --profile postgres up -d
  db:
    profiles: ["postgres"]
    image: postgres:16-alpine
    container_name: aio-bot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-centropic}
      POSTGRES_USER: ${POSTGRES_USER:-centropic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-centropic}
    volumes:
      - aio_bot_pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Proxy opzionale: usa profile "proxy"
  # docker compose --profile proxy up -d
  nginx:
    profiles: ["proxy"]
    image: nginx:1.27-alpine
    container_name: aio-bot-nginx
    restart: unless-stopped
    depends_on:
      aio-bot:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  aio_bot_data:
  aio_bot_pg:
  aio_bot_redis:
